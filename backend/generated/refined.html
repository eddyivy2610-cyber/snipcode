<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snipcode Live Preview</title>
  <style>
    /* Snipcode Design System Theme Stylesheet */
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-page: #090d13;
      --bg-card: #161b22;
      --bg-input: #0d1117;
      --border-card: #30363d;
      --border-input: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #c9d1d9;
      --text-muted: #8b949e;
      --accent-primary: #238636;
      --accent-hover: #2ea44f;
      --accent-gradient: linear-gradient(135deg, #238636, #2ea44f);
      --radius-card: 16px;
      --radius-input: 8px;
      --radius-btn: 8px;
      --shadow-card: 0 16px 40px rgba(0, 0, 0, 0.45);
      --shadow-btn-hover: 0 4px 14px rgba(46, 164, 79, 0.3);
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background: var(--bg-page);
      color: var(--text-secondary);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .screen {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-card);
      padding: 36px 32px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* --- Semantic Design System Components --- */
    .card, .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-card);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      box-shadow: var(--shadow-card);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      text-align: left;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-input {
      padding: 12px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: var(--radius-input);
      color: var(--text-primary);
      font-size: 0.95rem;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus { outline: none; border-color: var(--accent-hover); box-shadow: 0 0 0 3px rgba(88,166,255,0.15); }

    .btn {
      padding: 12px 24px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      background: var(--accent-gradient);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 8px;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-btn-hover); }

    .nav-link { color: #58a6ff; text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .nav-link:hover { color: #79c0ff; text-decoration: underline; }

    .inline-action {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .text-content { font-size: 1rem; line-height: 1.6; color: var(--text-primary); }
    .container-title { font-size: 1.35rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; text-align: center; }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      margin: 12px 0;
      width: 100%;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-card);
    }
    .divider span { padding: 0 12px; text-transform: uppercase; letter-spacing: 0.05em; }

    .input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
    .input-icon { position: absolute; right: 14px; cursor: pointer; font-size: 1.1rem; color: var(--text-muted); user-select: none; }
    .btn-icon { font-size: 1.1rem; display: inline-flex; align-items: center; margin-right: 6px; }

    /* --- Reusable Spacing Utility Classes --- */
    .mb-8  { margin-bottom: 8px !important; }
    .mb-12 { margin-bottom: 12px !important; }
    .mb-16 { margin-bottom: 16px !important; }
    .mb-20 { margin-bottom: 20px !important; }
    .mb-24 { margin-bottom: 24px !important; }
    .mb-32 { margin-bottom: 32px !important; }
    .mb-36 { margin-bottom: 36px !important; }
    .mb-40 { margin-bottom: 40px !important; }
    .mb-48 { margin-bottom: 48px !important; }
  </style>
</head>
<body>
  <main class="screen">
    <section class="card">
      <h2 class="container-title">Form Title</h2>
      <form>
        <div class="form-group">
          <label class="form-label" for="input-1">Input Label 1</label>
          <input class="form-input" id="input-1" type="text" placeholder="Input 1">
        </div>
        <div class="form-group">
          <label class="form-label" for="input-2">Input Label 2</label>
          <input class="form-input" id="input-2" type="password" placeholder="Input 2">
        </div>
        <button class="btn" type="submit">Submit</button>
      </form>
      <div class="divider"><span>OR</span></div>
      <button class="btn" type="button">Alternative Action</button>
      <p class="inline-action">Inline Action Text</p>
    </section>
  </main>
</body>
</html>
